[package]
name = "kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
test = true
bench = false

[[bin]]
name = "kernel"
test = false
bench = false

[features]
# shasha, the graphical shell (the compositor, wallpapers, fonts, start
# menu, taskbar): on by default; a server kernel leaves it out
# (`--no-default-features`; ROADMAP SD, ARCHITECTURE "Server and desktop
# workloads").
default = ["shasha"]
shasha = []
# gala-um: the kernel library as the NT layer inside a Linux process
# (kernel/src/hosted, docs/GALA_UM.md). Never set for the kernel binary.
hosted = ["dep:libc"]
# R9 (d): a stand-in for the next release, with a changed handover state
# format (handover::version: PROCESSES version 3, the WRITER section, the
# CLOCK record's in-memory structure laid out differently). xtask builds
# it into its own target directory for the handover_upgrade and
# handover_downgrade_refused scenarios. Never set for a release.
handover_next = []

[dependencies]
# R8: the signed manifest's Ed25519 signature (kernel/src/trust); no
# default features: no randomness, no std, no allocation.
ed25519-compact = { version = "=2.6.0", default-features = false }
libc = { version = "=0.2.191", optional = true }
# The Linux personality's ABI data (signals, layouts; kernel/lx_abi,
# host-tested against transcripts recorded on Linux).
lx_abi = { path = "lx_abi" }
# AFD's request layouts for both pointer sizes (kernel/afd_abi, shared
# with ws2_32: a WOW64 caller's are read as x86 ones).
afd_abi = { path = "afd_abi" }
noto-sans-mono-bitmap = { version = "0.3.2", default-features = false, features = ["size_16", "size_24", "regular", "bold", "unicode-basic-latin", "unicode-specials"] }
smoltcp = { version = "0.12", default-features = false, features = ["alloc", "medium-ethernet", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp"] }
spin = { version = "0.12.3", default-features = false, features = ["spin_mutex", "once"] }

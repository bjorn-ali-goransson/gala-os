[package]
name = "kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
test = true
bench = false

[[bin]]
name = "kernel"
test = false
bench = false

[features]
# gala-um: the kernel library as the NT layer inside a Linux process
# (kernel/src/hosted, docs/GALA_UM.md). Never set for the kernel binary.
hosted = ["dep:libc"]

[dependencies]
libc = { version = "=0.2.191", optional = true }
noto-sans-mono-bitmap = { version = "0.3.2", default-features = false, features = ["size_16", "size_24", "regular", "bold", "unicode-basic-latin", "unicode-specials"] }
smoltcp = { version = "0.12", default-features = false, features = ["alloc", "medium-ethernet", "medium-ip", "proto-ipv4", "socket-tcp"] }
spin = { version = "0.12.3", default-features = false, features = ["spin_mutex"] }

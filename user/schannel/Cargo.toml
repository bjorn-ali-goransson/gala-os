[package]
name = "schannel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# gala's schannel.dll: the Schannel security package's SSPI functions
# (secur32 forwards Schannel credentials and contexts here), over the TLS
# engine in `user/schannel_tls`.
[lib]
crate-type = ["cdylib"]
test = false
bench = false

[dependencies]
gala_heap = { path = "../gala_heap" }
schannel_tls = { path = "../schannel_tls" }
sha2 = { version = "0.10", default-features = false }

[target.'cfg(target_arch = "x86")'.dependencies]
ntrt = { path = "../ntrt" }

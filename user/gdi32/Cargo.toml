[package]
name = "gdi32"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
test = false
bench = false


[dependencies]
gala_stubs = { path = "../gala_stubs" }
gala_heap = { path = "../gala_heap" }
fontdue = { version = "0.9.5", default-features = false, features = ["hashbrown"] }
ttf-parser = { version = "0.25.1", default-features = false, features = ["no-std-float"] }
noto-sans-mono-bitmap = { version = "0.3.2", default-features = false, features = ["size_16", "size_20", "size_24", "size_32", "regular", "bold", "unicode-basic-latin", "unicode-specials"] }

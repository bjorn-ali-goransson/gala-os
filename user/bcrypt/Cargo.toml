[package]
name = "bcrypt"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
test = false
bench = false

[dependencies]
gala_stubs = { path = "../gala_stubs" }
gala_heap = { path = "../gala_heap" }
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
md-5 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
md2 = { version = "0.10", default-features = false }
md4 = { version = "0.10", default-features = false }
aes = { version = "0.8", default-features = false }
des = { version = "0.8", default-features = false }
rc2 = { version = "0.8", default-features = false }
rsa = { version = "0.9", default-features = false, features = ["u64_digit", "hazmat"] }
num-bigint-dig = { version = "0.8", default-features = false }
rand_core = { version = "0.6", default-features = false }

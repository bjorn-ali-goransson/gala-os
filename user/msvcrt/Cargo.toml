[package]
name = "msvcrt"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
test = false
bench = false

[dependencies]
libm = { version = "0.2.16", default-features = false }
gala_stubs = { path = "../gala_stubs" }

# The 32-bit build (SysWOW64's msvcrt): the memory routines, 64-bit
# division helpers and stack probe the compiler calls on x86.
[target.'cfg(target_arch = "x86")'.dependencies]
ntrt = { path = "../ntrt" }

[package]
name = "shellns"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# gala's shell namespace's model (ROADMAP EX step 1; ARCHITECTURE "The
# file explorer"): item ID lists, parsing names, display names and the
# order of items, without system calls, so `cargo test -p shellns` runs
# it on the host. shell32 (its IShellFolder and IShellItem) and
# explorer.exe use it.

[lib]
bench = false

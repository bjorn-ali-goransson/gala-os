[package]
name = "galapkg"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The package manager behind `gala install` (user/gala; ROADMAP PK,
# ARCHITECTURE "Installing software"): winget manifests, zip archives,
# the install transaction. `no_std` with `alloc`, so it links into the
# freestanding `gala.exe`; tested on the host with `cargo test -p galapkg`.

[lib]
bench = false

[dependencies]
gala_xml = { path = "../gala_xml" }
sha2 = { version = "0.10", default-features = false }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[package]
name = "explorer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# gala's File Explorer (ROADMAP EX; ARCHITECTURE "The file explorer"):
# the parts without system calls (the view's rows, sorting, search, the
# address bar's text, the numbers' and dates' formats) are the library,
# tested on the host with `cargo test -p explorer`; the program (the
# window) is `src/main.rs`.

[lib]
bench = false

[[bin]]
name = "explorer"
test = false
bench = false

[dependencies]
shellns = { path = "../shellns" }

[target.'cfg(windows)'.dependencies]
# The bin's allocator (the host tests have std's).
gala_heap = { path = "../gala_heap" }

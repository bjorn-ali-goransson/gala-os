# gala's nginx scenario: one process, logging to stderr, a static page on
# port 7 (forwarded from the host by QEMU).
master_process off;
worker_processes 1;
error_log stderr info;
pid nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;
    # zlib: even this small page is compressed for clients that accept it.
    gzip on;
    gzip_min_length 1;
    server {
        listen 7;
        # PCRE2: /old is rewritten to the page.
        rewrite ^/old$ /index.html last;
        location / {
            root html;
            index index.html;
        }
    }
}

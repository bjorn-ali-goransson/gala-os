# gala's nginx scenario: one process, logging to stderr, a static page on
# port 7 (forwarded from the host by QEMU).
master_process off;
worker_processes 1;
error_log stderr info;
pid nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;
    server {
        listen 7;
        location / {
            root html;
            index index.html;
        }
    }
}

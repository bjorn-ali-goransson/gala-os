# gala's nginx_tls scenario: one process, logging to stderr, the static
# page over TLS (OpenSSL) on port 7 (forwarded from the host by QEMU).
# gala-test.crt/.key are a self-signed test pair (not secret).
master_process off;
worker_processes 1;
error_log stderr info;
pid nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;
    server {
        listen 7 ssl;
        ssl_certificate gala-test.crt;
        ssl_certificate_key gala-test.key;
        location / {
            root html;
            index index.html;
        }
    }
}

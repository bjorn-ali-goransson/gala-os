[package]
name = "cfgmgr32"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
test = false
bench = false

[dependencies]
# The device tree in the registry, which gala's setupapi.dll reads too.
gala_pnp = { path = "../gala_pnp" }

[target.'cfg(target_arch = "x86")'.dependencies]
ntrt = { path = "../ntrt" }

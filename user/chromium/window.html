<!DOCTYPE html>
<html>
<head><title>gala window</title>
<style>
body { margin: 0; background: #2e8b57; color: #ffffff; font: 32px sans-serif; }
#box { position: absolute; left: 100px; top: 100px; width: 200px; height: 100px; background: #ff00ff; }
#link { position: absolute; left: 400px; top: 100px; width: 200px; height: 100px; background: #ffd700; display: block; }
#text { position: absolute; left: 100px; top: 250px; width: 200px; height: 40px; font: 24px sans-serif; }
</style>
</head>
<body>
<h1>Chromium on gala</h1>
<div id="box"></div>
<a id="link" href="window2.html" aria-label="gala link"></a>
<input id="text" aria-label="gala text">
<script>
// After two frames the page has been painted; the log line (Chromium's
// CONSOLE lines in the serial log) is the screen check's marker.
requestAnimationFrame(() => requestAnimationFrame(() => console.log("gala window painted")));
// The page's own view of the mouse: each press and click with where it
// landed (a click that never reaches the page is told from one that
// does).
for (const kind of ["mousedown", "click"]) {
  document.addEventListener(kind, (e) => console.log(
    "gala " + kind + " at " + e.clientX + "," + e.clientY + " on " +
    (e.target.id || e.target.tagName)), true);
}
document.addEventListener("keydown", (e) => console.log(
  "gala keydown " + e.key + " on " + (e.target.id || e.target.tagName)), true);
// Typing (keys from the keyboard, no IME): the field's focus and its
// text are the screen check's markers.
const text = document.getElementById("text");
text.addEventListener("focus", () => console.log("gala text focused"));
text.addEventListener("input", () => {
  if (text.value === "gala") console.log("gala typed " + text.value);
});
</script>
</body>
</html>

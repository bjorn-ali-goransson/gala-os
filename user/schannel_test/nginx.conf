# schannel_test's TLS server (Nginx with OpenSSL), started before the
# test: on gala by the scenario (`start=`, prefix C:/nginx/), on Windows
# by run-all.ps1. Loopback only. The certificates are certs/*.crt
# (certs/make.sh; test data, not secret).
master_process off;
worker_processes 1;
error_log stderr notice;
pid nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;
    ssl_protocols TLSv1.2 TLSv1.3;
    # The issued certificate: the test CA is a trusted root on the machine.
    server {
        listen 127.0.0.1:8443 ssl;
        ssl_certificate server.crt;
        ssl_certificate_key server.key;
        location / {
            root html;
            index index.html;
        }
    }
    # Self-signed: an untrusted root.
    server {
        listen 127.0.0.1:8444 ssl;
        ssl_certificate untrusted.crt;
        ssl_certificate_key untrusted.key;
        location / {
            root html;
        }
    }
    # Issued by the test CA, expired in 2021.
    server {
        listen 127.0.0.1:8445 ssl;
        ssl_certificate expired.crt;
        ssl_certificate_key expired.key;
        location / {
            root html;
        }
    }
}

# schannel_test's TLS server (Nginx with OpenSSL), started before the
# test: on gala by the scenario (`start=`, prefix C:/nginx/), on Windows
# by run-all.ps1. Loopback only: 8080 plain HTTP, 8443 the issued
# certificate, 8444 self-signed, 8445 expired, 8446 resumption from the
# server's session cache, 8447 client certificates, 8448 a revoked
# certificate, 8449 one the CA's CRL does not list. The certificates are
# certs/*.crt (certs/make.sh; test data, not secret).
#
# backlog=2 on the ports a test uses one connection at a time (a
# stopgap, ROADMAP "Known issues and stopgaps"): gala's TCP listener holds
# its backlog (up to 8) of the loopback interface's 64 sockets, so eight
# listeners at Nginx's default would take them all and no client could
# connect.
master_process off;
worker_processes 1;
error_log stderr notice;
pid nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Plain HTTP (winhttp_test, wininet_test).
    server {
        listen 127.0.0.1:8080;
        location / {
            root html;
            index index.html;
        }
        # Redirects (winhttp_test): a relative Location, one to https, a
        # loop, and a 307 (which keeps a POST a POST).
        location = /redirect-rel {
            absolute_redirect off;
            return 302 /;
        }
        location = /to-https {
            return 301 https://localhost:8443/;
        }
        location = /loop {
            absolute_redirect off;
            return 302 /loop;
        }
        location = /post-307 {
            absolute_redirect off;
            return 307 /;
        }
        # The test CA's CRL, at the distribution point revoked.crt and
        # notrevoked.crt name (html/ca.crl: certs/ca.crl).
        location = /ca.crl {
            root html;
            default_type application/pkix-crl;
        }
    }
    # The issued certificate: the test CA is a trusted root on the machine.
    server {
        listen 127.0.0.1:8443 ssl;
        ssl_certificate server.crt;
        ssl_certificate_key server.key;
        location / {
            root html;
            index index.html;
        }
        # Whether this connection resumed a session ("r") or not (".")
        # (schannel_test's resumption checks; session tickets here).
        location = /session {
            return 200 "$ssl_session_reused\n";
        }
        # https to http (winhttp_test: refused by WinHTTP's default policy).
        location = /to-http {
            return 302 http://127.0.0.1:8080/;
        }
        # A release download as GitHub serves one: the release URL
        # redirects to the file's storage URL (pk_install_https, which
        # ships html/objects).
        location = /releases/download/v1.0.0/pkhttps-1.0.0.zip {
            return 302 https://localhost:8443/objects/pkhttps-1.0.0.zip;
        }
        # A winget-pkgs tree served as files, each directory listed as
        # JSON (pk_install_https: `gala install --source
        # https://localhost:8443/winget-pkgs`, which ships html/winget-pkgs).
        location /winget-pkgs/ {
            root html;
            autoindex on;
            autoindex_format json;
        }
    }
    # Resumption from Nginx's own session cache, tickets off: TLS 1.2
    # session IDs, TLS 1.3 tickets naming a cached session.
    server {
        listen 127.0.0.1:8446 ssl backlog=2;
        ssl_certificate server.crt;
        ssl_certificate_key server.key;
        ssl_session_cache builtin:1000;
        ssl_session_tickets off;
        location = /session {
            return 200 "$ssl_session_reused\n";
        }
    }
    # Client certificates: asked for, optional, issued by the test CA
    # (certs/client.crt). /client says what Nginx saw.
    server {
        listen 127.0.0.1:8447 ssl backlog=2;
        ssl_certificate server.crt;
        ssl_certificate_key server.key;
        ssl_client_certificate ca.crt;
        ssl_verify_client optional;
        location = /client {
            return 200 "$ssl_client_verify $ssl_client_s_dn\n";
        }
    }
    # Self-signed: an untrusted root.
    server {
        listen 127.0.0.1:8444 ssl backlog=2;
        ssl_certificate untrusted.crt;
        ssl_certificate_key untrusted.key;
        location / {
            root html;
        }
    }
    # Revocation (schannel_test, curl_schannel): issued by the test CA,
    # naming its CRL (certs/ca.crl), which lists 8448's and not 8449's.
    server {
        listen 127.0.0.1:8448 ssl backlog=2;
        ssl_certificate revoked.crt;
        ssl_certificate_key revoked.key;
        location / {
            root html;
            index index.html;
        }
    }
    server {
        listen 127.0.0.1:8449 ssl backlog=2;
        ssl_certificate notrevoked.crt;
        ssl_certificate_key notrevoked.key;
        location / {
            root html;
            index index.html;
        }
    }
    # Issued by the test CA, expired in 2021.
    server {
        listen 127.0.0.1:8445 ssl backlog=2;
        ssl_certificate expired.crt;
        ssl_certificate_key expired.key;
        location / {
            root html;
        }
    }
}

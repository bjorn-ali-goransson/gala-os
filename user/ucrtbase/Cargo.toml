[package]
name = "ucrtbase"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
# gala's Universal C Runtime (ARCHITECTURE "The UCRT"): a second build of
# user/msvcrt's source, with `cfg(ucrt)` (set by the shared build.rs for
# this package) adding the UCRT's own functions (user/msvcrt/src/ucrt/).
# One source, two DLLs with their own state, as on Windows.
build = "../msvcrt/build.rs"

[lib]
path = "../msvcrt/src/lib.rs"
crate-type = ["cdylib"]
test = false
bench = false

[dependencies]
libm = { version = "0.2.16", default-features = false }
gala_stubs = { path = "../gala_stubs" }

[target.'cfg(target_arch = "x86")'.dependencies]
ntrt = { path = "../ntrt" }

[package]
name = "schannel_tls"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The Schannel package's TLS engine: SSPI's token and message rules over
# rustls' unbuffered API (no_std with alloc), host-tested. schannel.dll
# (`user/schannel`) wraps it in the SSPI functions.
[lib]
bench = false

[dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["tls12"] }
rustls-rustcrypto = { version = "0.0.2-alpha", default-features = false, features = ["alloc", "tls12"] }

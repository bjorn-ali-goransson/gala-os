[package]
name = "user32"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
test = false
bench = false

[dependencies]
gala_stubs = { path = "../gala_stubs" }
gala_heap = { path = "../gala_heap" }

# The 32-bit build (SysWOW64's user32): the memory routines, 64-bit
# division helpers and unwind personality the compiler calls on x86.
[target.'cfg(target_arch = "x86")'.dependencies]
ntrt = { path = "../ntrt" }

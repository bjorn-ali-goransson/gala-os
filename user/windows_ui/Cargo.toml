[package]
name = "windows_ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Windows.UI.dll (cargo names the cdylib windows_ui.dll; xtask ships it
# under Windows' name).
[lib]
crate-type = ["cdylib"]
test = false
bench = false

[target.'cfg(target_arch = "x86")'.dependencies]
ntrt = { path = "../ntrt" }

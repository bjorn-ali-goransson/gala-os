[package]
name = "taskmgr"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# gala's Task Manager (ROADMAP TM, ARCHITECTURE "The task manager"): the
# parts without system calls (the kernel's records, the groups, sorting,
# filtering, the CPU shares, the numbers' formats) are the library,
# tested on the host with `cargo test -p taskmgr`; the program (the
# window) is `src/main.rs`.

[lib]
bench = false

[[bin]]
name = "taskmgr"
test = false
bench = false

[target.'cfg(windows)'.dependencies]
# The bin's allocator (the host tests have std's).
gala_heap = { path = "../gala_heap" }

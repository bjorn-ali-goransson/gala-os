[package]
name = "windowscodecs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
test = false
bench = false

[dependencies]
gala_heap = { path = "../gala_heap" }
# The PNG decoder (gdiplus's png.rs) inflates with it.
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[package]
name = "dwrite"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
test = false
bench = false

[dependencies]
gala_heap = { path = "../gala_heap" }
fontdue = { version = "0.9.5", default-features = false, features = ["hashbrown"] }
ttf-parser = { version = "0.25.1", default-features = false, features = ["no-std-float"] }

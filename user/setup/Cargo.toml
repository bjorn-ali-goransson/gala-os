[package]
name = "setup"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# What gala's installer writes (user/gala's `gala setup`; ROADMAP IN step
# 4, ARCHITECTURE "Installing gala onto a disk"): a FAT32 EFI system
# partition from a release's files, read from a tar. `no_std` with
# `alloc`, so it links into the freestanding `gala.exe`; tested on the host
# with `cargo test -p setup`.

[lib]
bench = false

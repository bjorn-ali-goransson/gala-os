# The kernel only builds for x86_64-unknown-none; build it via `cargo xtask`.
default-members = ["xtask"]
# Vendored dependencies (with gala's patches, THIRD_PARTY.md) are not members.
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[profile.dev]
panic = "abort"

# The kernel's test builds keep debug assertions and overflow checks but are
# lightly optimized: unoptimized, a system call cost ~30x more, which made
# boot tests running Go programs slow.
[profile.dev.package.kernel]
opt-level = 1
# A codegen unit per module (the kernel has about 400; rustc's default for
# an incremental build is 256, and it merges modules into that many by
# size): an edit to one module then never moves another module's code
# into another unit, where it would be inlined differently. A hot swap of
# the kernel (ROADMAP SN step 1e) compares builds function by function,
# so this keeps a change to what it is.
codegen-units = 1024

# The manifest's signature check (R8) at every boot: optimized in test
# builds too.
[profile.dev.package.ed25519-compact]
opt-level = 3

[profile.release]
panic = "abort"
debug = true

# The builds of user/hotswap_dll the hot swap scenarios swap in (ROADMAP
# SN step 1d; xtask `hotswap_variant`): release with a feature, in a
# directory of their own (target/<triple>/hotswap-v2/), so the first
# build's file is never overwritten by them.
[profile.hotswap-v2]
inherits = "release"

[profile.hotswap-layout]
inherits = "release"

# The kernel builds the kernel hot swap scenarios swap in (ROADMAP SN step
# 1e; xtask `kernel_variant`, with the kernel's `hotswap_v2` or
# `hotswap_layout` feature): the settings of the build they are swapped
# into (dev, or release with `--release`), in a directory of their own
# (target/x86_64-unknown-none/khotswap/), so that the default kernel is
# never replaced while other scenarios make their images.
[profile.khotswap]
inherits = "dev"

[profile.khotswap.package.kernel]
opt-level = 1
codegen-units = 1024

[profile.khotswap.package.ed25519-compact]
opt-level = 3

[profile.khotswap-release]
inherits = "release"

# smoltcp 0.12.0 with gala's patch (THIRD_PARTY.md): a TCP socket's state as
# plain values, to carry connections across a kernel handover (ROADMAP R9 (e)).
[patch.crates-io]
smoltcp = { path = "vendor/smoltcp" }
# getrandom 0.2.17 with gala's patch (THIRD_PARTY.md): Windows' RNG
# through ProcessPrng bound by raw-dylib, so that freestanding DLLs (no
# import libraries) can link the RustCrypto crates schannel.dll uses.
getrandom = { path = "vendor/getrandom" }

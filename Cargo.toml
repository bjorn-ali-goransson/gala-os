[workspace]
resolver = "3"
members = ["kernel", "user/abi_test", "user/apc_test", "user/args_test", "user/bench", "user/async_test", "user/file_test", "user/filemap_test", "user/fpu_test", "user/guard_test", "user/context_test", "user/cow_test", "user/crash", "user/exception_test", "user/dir_test", "user/hello", "user/import_test", "user/iocp_test", "user/ioapc_test", "user/kernel32", "user/kernel32_test", "user/kernel32_sys_test", "user/kuser_test", "user/missing_import_test", "user/ledger_test", "user/loader_test", "user/ntrt", "user/object_test", "user/peb_test", "user/section_test", "user/smp_test", "user/smpsched_test", "user/smpmem_test", "user/startup_test", "user/symlink_test", "user/sync_test", "user/sysinfo_test", "user/testdll", "user/testdll2", "user/testntdll", "user/thread_test", "user/threadinfo_test", "user/timer_test", "user/image_test", "user/vm_test", "user/wait_test", "xtask"]
# The kernel only builds for x86_64-unknown-none; build it via `cargo xtask`.
default-members = ["xtask"]

[workspace.package]
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true

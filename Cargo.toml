[workspace]
resolver = "3"
members = ["kernel", "user/abi_test", "user/apc_test", "user/args_test", "user/bcryptprimitives", "user/bench", "user/async_test", "user/file_test", "user/filemap_test", "user/fpu_test", "user/guard_test", "user/context_test", "user/cow_test", "user/crash", "user/exception_test", "user/dir_test", "user/hello", "user/import_test", "user/iocp_test", "user/ioapc_test", "user/kernel32", "user/kernel32_test", "user/kernel32_sys_test", "user/kernel32_thread_test", "user/kernel32_sync_test", "user/kernel32_locale_test", "user/kernel32_system_test", "user/kernel32_clr_test", "user/com_test", "user/bcrypt_test", "user/console_test", "user/registry_test", "user/keyed_event_test", "user/iphlpapi_test", "user/afd_poll_test", "user/dirchange_test", "user/advapi32_test", "user/win32_misc_test", "user/kernel32_pool_test", "user/tls_test", "user/manifest_test", "user/kernel32_misc_test", "user/kernel32_env_test", "user/kernel32_file_test", "user/lock_test", "user/kuser_test", "user/missing_import_test", "user/unimplemented_test", "user/rpcrt4_test", "user/netapi32_test", "user/clusapi_test", "user/sspi_test", "user/dpapi_test", "user/clusapi", "user/resutils", "user/security", "user/ledger_test", "user/loader_test", "user/ntrt", "user/object_test", "user/peb_test", "user/prng_test", "user/section_test", "user/seh_test", "user/smp_test", "user/smpsched_test", "user/smpmem_test", "user/startup_test", "user/symlink_test", "user/sync_test", "user/sysinfo_test", "user/testdll", "user/testdll2", "user/tlsdll", "user/testntdll", "user/thread_test", "user/threadinfo_test", "user/timer_test", "user/image_test", "user/vm_test", "user/wait_test", "user/winsock_test", "user/winsock_async_test", "user/process_test", "user/pipe_test", "user/advapi32", "user/crypt32", "user/user32", "user/winmm", "user/comctl32", "user/powrprof", "user/shell32", "user/version", "user/psapi", "user/bcrypt", "user/ole32", "user/oleaut32", "user/iphlpapi", "user/secur32", "user/winhttp", "user/ncrypt", "user/mswsock", "user/msvcrt", "user/ws2_32", "user/gala_stubs", "user/netapi32", "user/pdh", "user/shlwapi", "user/rpcrt4", "user/urlmon", "user/wininet", "user/userenv", "user/xolehlp", "user/odbc32", "user/authz", "user/wintrust", "user/webservices", "user/dhcpcsvc", "user/dbghelp", "user/xmllite", "um", "xtask"]
# The kernel only builds for x86_64-unknown-none; build it via `cargo xtask`.
default-members = ["xtask"]

[workspace.package]
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[profile.dev]
panic = "abort"

# The kernel's test builds keep debug assertions and overflow checks but are
# lightly optimized: unoptimized, a system call cost ~30x more, which made
# boot tests running Go programs slow.
[profile.dev.package.kernel]
opt-level = 1

[profile.release]
panic = "abort"
debug = true

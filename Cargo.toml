# The kernel only builds for x86_64-unknown-none; build it via `cargo xtask`.
default-members = ["xtask"]
# Vendored dependencies (with gala's patches, THIRD_PARTY.md) are not members.
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[profile.dev]
panic = "abort"

# The kernel's test builds keep debug assertions and overflow checks but are
# lightly optimized: unoptimized, a system call cost ~30x more, which made
# boot tests running Go programs slow.
[profile.dev.package.kernel]
opt-level = 1

# The manifest's signature check (R8) at every boot: optimized in test
# builds too.
[profile.dev.package.ed25519-compact]
opt-level = 3

[profile.release]
panic = "abort"
debug = true

# smoltcp 0.12.0 with gala's patch (THIRD_PARTY.md): a TCP socket's state as
# plain values, to carry connections across a kernel handover (ROADMAP R9 (e)).
[patch.crates-io]
smoltcp = { path = "vendor/smoltcp" }

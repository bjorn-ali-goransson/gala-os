name: Images

# Downloadable boot images (WORKFLOW "Downloadable images"): nightly, main's
# latest commit whose CI passed, the desktop demo (`cargo xtask iso`) built for
# x86_64 (a hybrid BIOS/UEFI ISO, also for a USB stick) and for aarch64
# (UEFI, QEMU `virt`) and uploaded to the R2 bucket under images/latest/,
# overwriting the previous build (only the latest is kept): each image with
# its SHA-256 and the commit it was built from, the image first so the
# checksum never names a file not there yet. Public at
# https://updates.gala-os.com/images/latest/.

on:
  schedule:
    # Nightly, off-peak (02:23 UTC); a night with no new green commit
    # builds nothing (the commit check below).
    - cron: "23 2 * * *"
  workflow_dispatch:

# A newer build replaces an older one still running (only the latest is
# kept).
concurrency:
  group: images
  cancel-in-progress: true

permissions:
  contents: read
  # Which of main's commits CI passed on (gh run list).
  actions: read

env:
  IMAGES_URL: https://updates.gala-os.com/images/latest

jobs:
  image:
    # The schedule (main), or a manual run from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    # The bucket's credentials, as release.yml's.
    environment: release
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    name: image (${{ matrix.arch }})
    env:
      # No incremental data (the host's xtask): smaller build caches.
      CARGO_INCREMENTAL: "0"
    steps:
      # The commit to build: main's newest whose CI passed on a push (a red
      # main never replaces a good image); none to build when the bucket's
      # image is that commit's already.
      - name: Main's latest green commit, unless already built
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --event push --status success --limit 1 --json headSha --jq '.[0].headSha')
          if [ -z "$sha" ]; then
            echo "::error::no green CI run on main found"
            exit 1
          fi
          echo "SHA=$sha" >> "$GITHUB_ENV"
          built=$(curl -sSfL "$IMAGES_URL/gala-${{ matrix.arch }}.commit" 2>/dev/null || true)
          if [ "$built" = "$sha" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::gala-${{ matrix.arch }}.iso is $sha's already: nothing to build"
            echo "Not built: the image is already $sha's." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "Building $sha (the image was ${built:-none})." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.head.outputs.current == 'true'
        with:
          ref: ${{ env.SHA }}
      - name: Free disk space (the runner's Android, .NET and GHC toolchains; gala needs none)
        if: steps.head.outputs.current == 'true'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      # The build (WORKFLOW "CI build caches"), per machine: the previous
      # image build's; sources dated for cargo by restore-mtimes.sh.
      - name: Restore the build cache
        if: steps.head.outputs.current == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/x86_64-unknown-none
            target/aarch64-unknown-none-softfloat
            target/x86_64-pc-windows-msvc
            target/aarch64-pc-windows-msvc
            target/i686-pc-windows-msvc
            target/debug/deps
            target/debug/build
            target/debug/.fingerprint
            target/release/deps
            target/release/build
            target/release/.fingerprint
            target/cache-stamp
          key: gala-target-images-${{ matrix.arch }}-${{ env.SHA }}
          restore-keys: gala-target-images-${{ matrix.arch }}-
      - name: Date the sources for cargo
        if: steps.head.outputs.current == 'true'
        run: .github/restore-mtimes.sh target/cache-stamp
      - name: Install xorriso
        if: steps.head.outputs.current == 'true'
        run: sudo apt-get update && sudo apt-get install -y xorriso
      - name: Install Go (the x86_64 demo's Go programs; pinned in xtask GO_TOOLCHAIN)
        if: steps.head.outputs.current == 'true' && matrix.arch == 'x86_64'
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache: false
      - name: Install toolchain
        if: steps.head.outputs.current == 'true'
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build the image
        if: steps.head.outputs.current == 'true'
        run: |
          cargo xtask iso --release --arch "${{ matrix.arch }}"
          name=$([ "${{ matrix.arch }}" = aarch64 ] && echo gala-aarch64 || echo gala-demo)
          mkdir -p out
          cp "target/release/$name.iso" "out/gala-${{ matrix.arch }}.iso"
          (cd out && sha256sum "gala-${{ matrix.arch }}.iso" > "gala-${{ matrix.arch }}.iso.sha256")
          echo "$SHA" > "out/gala-${{ matrix.arch }}.commit"
          {
            echo "### gala-${{ matrix.arch }}.iso"
            echo "commit $SHA, $(stat -c %s "out/gala-${{ matrix.arch }}.iso") bytes"
            echo '```'
            cat "out/gala-${{ matrix.arch }}.iso.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save the build cache
        if: steps.head.outputs.current == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/x86_64-unknown-none
            target/aarch64-unknown-none-softfloat
            target/x86_64-pc-windows-msvc
            target/aarch64-pc-windows-msvc
            target/i686-pc-windows-msvc
            target/debug/deps
            target/debug/build
            target/debug/.fingerprint
            target/release/deps
            target/release/build
            target/release/.fingerprint
            target/cache-stamp
          key: gala-target-images-${{ matrix.arch }}-${{ env.SHA }}
      - name: Upload (the image, then its checksum and commit)
        if: steps.head.outputs.current == 'true'
        # In the step, not the workflow's env: the R2 variables are the
        # release environment's, which the workflow-level env cannot see
        # (the endpoint came out as https://.r2.cloudflarestorage.com).
        env:
          AWS_ENDPOINT_URL: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          IMAGES: s3://${{ vars.R2_BUCKET }}/images/latest
        run: |
          if [ -z "${{ vars.R2_ACCOUNT_ID }}" ] || [ -z "${{ vars.R2_BUCKET }}" ]; then
            echo "::error::R2_ACCOUNT_ID or R2_BUCKET is empty in this job (the release environment's variables)"
            exit 1
          fi
          f="gala-${{ matrix.arch }}"
          aws s3 cp "out/$f.iso" "$IMAGES/$f.iso" --content-type application/x-iso9660-image --cache-control no-cache --no-progress
          aws s3 cp "out/$f.iso.sha256" "$IMAGES/$f.iso.sha256" --content-type text/plain --cache-control no-cache --no-progress
          aws s3 cp "out/$f.commit" "$IMAGES/$f.commit" --content-type text/plain --cache-control no-cache --no-progress
      - name: Check the public download
        if: steps.head.outputs.current == 'true'
        run: |
          f="gala-${{ matrix.arch }}"
          curl -sSfL -o "check.iso" "$IMAGES_URL/$f.iso"
          curl -sSfL "$IMAGES_URL/$f.iso.sha256" | sed "s/$f.iso/check.iso/" | sha256sum -c -
          echo "$IMAGES_URL/$f.iso" >> "$GITHUB_STEP_SUMMARY"

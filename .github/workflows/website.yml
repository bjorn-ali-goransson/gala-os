name: Website

# gala-os.com (WORKFLOW "The website"): the static site in `web/`, built
# with Vite and prerendered to HTML, published to GitHub Pages.
#
# The website and the system are deliberately separate pipelines: a change
# under `web/` never starts the kernel's QEMU and Windows runners, and a
# change to the kernel never republishes the website. The other half of
# that separation is in ci.yml (its `changes` job).

on:
  push:
    branches: [main]
    paths:
      - web/**
      - .github/workflows/website.yml
  pull_request:
    paths:
      - web/**
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the older run; pushes to
# main queue instead, so a publish is never half-applied.
concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (exactly the locked versions)
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Build and prerender
        working-directory: web
        run: npm run build
      # The two files that make Pages serve the site at the apex domain
      # instead of the project path, and stop it running the output
      # through Jekyll. A build that loses them would publish a site that
      # answers on the wrong host, so it fails here instead.
      - name: The build carries its domain and bypasses Jekyll
        run: |
          test "$(cat web/dist/CNAME)" = gala-os.com
          test -f web/dist/.nojekyll
      - name: The page is real markup, not an empty shell
        run: grep -q "ABI boundary" web/dist/index.html
      # The files crawlers read. sitemap.xml and llms.txt are generated by
      # prerender.mjs from the same content the page is built from, so a
      # build that stopped producing them would silently publish a site
      # nothing could index. The IndexNow key is served at its own name:
      # a mismatch makes every submission below fail authentication.
      - name: The crawler files are there and agree with each other
        run: |
          set -euo pipefail
          grep -q "^Sitemap: https://gala-os.com/sitemap.xml$" web/dist/robots.txt
          grep -q "<loc>https://gala-os.com/</loc>" web/dist/sitemap.xml
          test "$(wc -c < web/dist/llms.txt)" -gt 4000
          key=$(ls web/dist | grep -E '^[0-9a-f]{32}\.txt$' | sed 's/\.txt$//')
          test -n "$key"
          test "$(cat "web/dist/$key.txt")" = "$key"
          echo "indexnow key $key is served under its own name"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  # Only main publishes. A pull request is built and checked above, which
  # is what makes a broken site fail before it is live.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
      # IndexNow tells Bing, Yandex, Seznam and Naver that the page changed,
      # instead of waiting for them to come back on their own schedule.
      # Google does not take part: it finds the page through robots.txt's
      # sitemap line and Search Console. A submission that fails is worth
      # knowing about but must not fail a deploy that already succeeded,
      # so the response code is reported and swallowed.
      - name: Tell IndexNow the page changed
        env:
          INDEXNOW_KEY: bbeed7d8e7505829e82d1e36925128fd
        run: |
          set -uo pipefail
          url="https://api.indexnow.org/indexnow?url=https%3A%2F%2Fgala-os.com%2F&key=${INDEXNOW_KEY}&keyLocation=https%3A%2F%2Fgala-os.com%2F${INDEXNOW_KEY}.txt"
          code=$(curl -sS -o indexnow.out -w '%{http_code}' "$url" || echo 000)
          echo "IndexNow replied $code"
          cat indexnow.out || true
          case "$code" in
            200|202) echo "accepted" ;;
            *) echo "::warning title=IndexNow::submission returned $code; Bing and Yandex still find the page through the sitemap" ;;
          esac

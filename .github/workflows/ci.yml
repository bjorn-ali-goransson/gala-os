name: CI

on:
  # Pull requests, and main after a merge; a branch without a pull request
  # gets no run (each push to a pull request's branch ran twice otherwise).
  push:
    branches: [main]
    # The website has its own pipeline (website.yml). A merge that only
    # touches it starts no runner here, and so publishes no release
    # either (release.yml runs off this workflow's completion).
    paths-ignore:
      - web/**
      - .github/workflows/website.yml
  # Not filtered by path: the `linux` and `windows` checks are required by
  # the `main-run-ci` ruleset, and a workflow skipped by a path filter
  # never reports them, leaving the pull request waiting for a status that
  # can never arrive. The `changes` job below makes the skip decision
  # instead, where it is visible and reports a conclusion.
  pull_request:

# A newer push to the same pull request cancels the run of the older one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which half of the repository a pull request touches: the website
  # (`web/`, published by website.yml) or the system. A pull request that
  # only moves the website skips the jobs below rather than spending a
  # QEMU runner and a Windows runner on it.
  changes:
    runs-on: ubuntu-26.04
    outputs:
      code: ${{ steps.what.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: what
        name: Is there anything outside web/ in this change
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A push to main is already filtered by paths-ignore above, and
          # a manual run means "run everything".
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request: the system jobs run"
            exit 0
          fi
          # The fork point, not the base tip: a base that has moved on
          # since would otherwise show its own commits as this change's.
          fork=$(git merge-base "$BASE" "$HEAD")
          changed=$(git diff --name-only "$fork" "$HEAD")
          echo "$changed" | sed 's/^/  /'
          # No files at all means something unexpected about the range, so
          # run the system jobs rather than silently skipping them.
          if [ -z "$changed" ] || echo "$changed" | grep -qvE '^(web/|\.github/workflows/website\.yml$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "the system is touched: the system jobs run"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "website only: the system jobs are skipped"
          fi

  # gala itself: the kernel and its programs, booted in QEMU. GitHub's Linux
  # runners have hardware virtualization, so the boots run under KVM (xtask
  # passes `-accel kvm` when /dev/kvm exists and falls back to TCG).
  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the runner's Android, .NET and GHC toolchains; gala needs none)
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Let QEMU use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      # user/lx/bin is checked in and rebuilt here byte for byte, so the
      # toolchain that builds it has to be one every machine can get. Ubuntu
      # 26.04 publishes two builds of each package under the same version: the
      # plain amd64 one and an amd64v3 one, optimised for x86-64-v3 (apt-cache
      # policy names it "resolute/main amd64v3 Packages"). An image opts into
      # the variant with APT::Architecture-Variants, as this one does, and then
      # every package it installs is that build: gcc defaults to
      # -march=x86-64-v3 and emits AVX2 where the plain one emits none, and
      # musl-dev's static libc is compiled that way too (3961 VEX-encoded
      # instructions against the plain build's none). The same sources then
      # give different bytes, in the programs' own code and in the libc linked
      # into them, and user/lx/build.sh refuses to build that way.
      #
      # So the option is cleared for the whole job, in apt's own
      # configuration: every apt-get below takes the plain archive, the next
      # step's musl-dev among them. apt reads its configuration in order
      # (apt.conf.d by name, then apt.conf), and a #clear clears only what
      # was read before it: a file read later selects the variant again
      # (runner image 20261111.82: "#clear" written to 99-plain-amd64, and
      # the dump right after still said amd64v3). Where an image sets the
      # option is the image's business, so the clear goes in the file read
      # last of apt.conf.d (zz-), apt.conf loses any line setting it, and the
      # step fails, naming the files that set it, if apt still selects a
      # variant: the gcc check below would only see the consequence. What
      # the rebuild rests on is then stated in the lx step below, where the
      # cause can still be named: a byte diff cannot name it.
      - name: Take every package from the plain amd64 archive, not amd64v3
        run: |
          echo "where the image sets an architecture variant:"
          sudo grep -rn 'Architecture-Variants' /etc/apt/ || echo "  nowhere"
          printf '#clear APT::Architecture-Variants;\n' | sudo tee /etc/apt/apt.conf.d/zz-plain-amd64
          if [ -f /etc/apt/apt.conf ]; then sudo sed -i '/Architecture-Variants/d' /etc/apt/apt.conf; fi
          # Cleared, the dump shows the option empty (`... "";`).
          if apt-config dump | grep -i 'Architecture-Variants "[^"]'; then
            echo "::error::apt still selects an architecture variant (above) after the clear; the files that set it are listed above"
            exit 1
          fi
          echo "no architecture variant is selected"
          sudo apt-get update
          sudo apt-get install -y --reinstall --allow-downgrades gcc-15 cpp-15-x86-64-linux-gnu gcc-15-x86-64-linux-gnu libgcc-15-dev binutils libc6-dev
          apt-cache policy cpp-15-x86-64-linux-gnu | sed -n '1,6p'
      - name: Install QEMU, OVMF, xorriso, musl-tools, weston, Xvfb, GTK 3, gdb
        # gdb, and Yama letting it attach to a process it did not start:
        # a QEMU whose monitor stops answering gets its threads' stacks
        # taken into the failed log (OBSERVABILITY "State dump").
        run: |
          sudo sysctl -w kernel.yama.ptrace_scope=0
          sudo apt-get update && sudo apt-get install -y gdb qemu-system-x86 ovmf xorriso msitools 7zip unzip openssh-client postgresql-client musl-tools weston xvfb libgtk-3-0t64 shared-mime-info libglib2.0-bin libglib2.0-dev libpixman-1-dev libslirp-dev flex bison ninja-build python3-venv libfdt-dev zlib1g-dev
      # No distribution QEMU is used: 8.1.0-8.2.5 had the translated-block bug
      # that broke JIT code, and this image's 10.2.1 wedges under KVM before the
      # kernel logs a phase (WORKFLOW "QEMU"); xtask builds the pinned one. The
      # key names the image's release: the build links against the image's
      # libraries, so a build from another release must not be restored here.
      - name: Cache the pinned QEMU
        uses: actions/cache@v4
        with:
          path: ~/.cache/gala-qemu
          key: gala-qemu-11.1.3-x86_64-aarch64-ubuntu-26.04
      - name: Build the pinned QEMU
        run: cargo xtask qemu
      # The pinned downloads the host tests and gala-um use (the JDK...),
      # kept between runs as in the boot jobs (each checksum-checked at use).
      - name: Cache the pinned prebuilt programs
        uses: actions/cache@v4
        with:
          path: |
            target/prebuilt
            !target/prebuilt/chromium-syms
          key: gala-prebuilt-linux-${{ hashFiles('xtask/src/main.rs') }}
          restore-keys: gala-prebuilt-linux-
      - name: Install Go (for user/go_hello; pinned in xtask GO_TOOLCHAIN)
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache: false
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: |
          cargo clippy -p kernel --target x86_64-unknown-none -- -D warnings
          # The architecture seam (ARCHITECTURE "The architecture seam"): x86
          # assumptions outside kernel/src/arch do not build for aarch64.
          cargo clippy -p kernel --target aarch64-unknown-none-softfloat -- -D warnings
          # gala's DLLs for ARM64 (ROADMAP PT): checked and built (a build,
          # because Clippy does not assemble inline assembly). wow64 runs x86
          # code on x64 by nature: not built for ARM64.
          cargo clippy --release --target aarch64-pc-windows-msvc -p testdll -p testdll2 -p testdll_gap -p hotswap_dll -p imagetrim_dll -p testntdll -p kernel32 -p bcryptprimitives -p advapi32 -p comctl32 -p powrprof -p shell32 -p version -p psapi -p ole32 -p oleaut32 -p bcrypt -p tlsdll -p iphlpapi -p secur32 -p winhttp -p http_client -p gala_stubs -p gala_heap -p gala_ui -p netapi32 -p pdh -p setupapi -p shlwapi -p rpcrt4 -p urlmon -p wininet -p userenv -p xolehlp -p odbc32 -p wldap32 -p wsock32 -p kernelbase -p gdi32 -p authz -p wintrust -p webservices -p dhcpcsvc -p dbghelp -p msvcrt -p ucrtbase -p crypt32 -p ncrypt -p msi -p msxml6 -p combase -p appxdeploymentclient -p shfolder -p dwmapi -p cfgmgr32 -p dwrite -p imm32 -p shcore -p wtsapi32 -p msctf -p xmllite -p uxtheme -p comdlg32 -p oleacc -p uiautomationcore -p mpr -p winspool -p msimg32 -p richedit -p riched20 -p msftedit -p clusapi -p resutils -p security -p normaliz -p wldp -p rstrtmgr -p wofutil -p sppc -p schannel_tls -p schannel -p schannel_test -p user32 -p gdiplus -p windowscodecs -p d2d1 -p windows_ui -p d3dcompiler_47 -p ws2_32 -p mswsock -p winmm -p d3d11 -p d3d12 -p dcomp -p dxgi -- -D warnings
          cargo build --release --target aarch64-pc-windows-msvc -p testdll -p testdll2 -p testdll_gap -p hotswap_dll -p imagetrim_dll -p testntdll -p kernel32 -p bcryptprimitives -p advapi32 -p comctl32 -p powrprof -p shell32 -p version -p psapi -p ole32 -p oleaut32 -p bcrypt -p tlsdll -p iphlpapi -p secur32 -p winhttp -p http_client -p gala_stubs -p gala_heap -p netapi32 -p pdh -p setupapi -p shlwapi -p rpcrt4 -p urlmon -p wininet -p userenv -p xolehlp -p odbc32 -p wldap32 -p wsock32 -p kernelbase -p gdi32 -p authz -p wintrust -p webservices -p dhcpcsvc -p dbghelp -p msvcrt -p ucrtbase -p crypt32 -p ncrypt -p msi -p msxml6 -p combase -p appxdeploymentclient -p shfolder -p dwmapi -p cfgmgr32 -p dwrite -p imm32 -p shcore -p wtsapi32 -p msctf -p xmllite -p uxtheme -p comdlg32 -p oleacc -p uiautomationcore -p mpr -p winspool -p msimg32 -p richedit -p riched20 -p msftedit -p clusapi -p resutils -p security -p normaliz -p wldp -p rstrtmgr -p wofutil -p sppc -p schannel_tls -p schannel -p schannel_test -p user32 -p gdiplus -p windowscodecs -p d2d1 -p windows_ui -p d3dcompiler_47 -p ws2_32 -p mswsock -p winmm -p d3d11 -p d3d12 -p dcomp -p dxgi
          cargo clippy -p kernel --lib --tests -- -D warnings
          cargo clippy -p xtask -- -D warnings
          cargo clippy -p kernel --lib --features hosted -- -D warnings
          cargo clippy -p um -- -D warnings
          cargo clippy -p galapkg --tests -- -D warnings
          cargo clippy -p wsl --lib --tests -- -D warnings
          cargo clippy -p taskmgr --lib --tests -- -D warnings
          cargo clippy -p shellns --tests -- -D warnings
          cargo clippy -p explorer --lib --tests -- -D warnings
          cargo clippy -p gala_ui --tests -- -D warnings
          cargo clippy -p gala_xml --tests -- -D warnings
          cargo clippy -p lx_abi --tests -- -D warnings
          cargo clippy -p wl_abi --tests -- -D warnings
          cargo clippy -p afd_abi --tests -- -D warnings
          cargo clippy -p schannel_tls --tests -- -D warnings
          cargo clippy -p tuf --tests -- -D warnings
          cargo clippy -p lx_abi --target x86_64-unknown-none -- -D warnings
          cargo clippy -p wl_abi --target x86_64-unknown-none -- -D warnings
          cargo build --release --target x86_64-pc-windows-msvc -p testdll -p testdll2 -p testdll_gap -p hotswap_dll -p imagetrim_dll -p testntdll -p kernel32 -p bcryptprimitives
          cargo clippy --release --target x86_64-pc-windows-msvc -p testdll -p testdll2 -p testdll_gap -p hotswap_dll -p imagetrim_dll -p testntdll -p kernel32 -p bcryptprimitives -p advapi32 -p comctl32 -p powrprof -p shell32 -p version -p psapi -p ole32 -p oleaut32 -p bcrypt -p tlsdll -p iphlpapi -p secur32 -p winhttp -p http_client -p gala_stubs -p gala_heap -p netapi32 -p pdh -p setupapi -p shlwapi -p rpcrt4 -p urlmon -p wininet -p userenv -p xolehlp -p odbc32 -p wldap32 -p wsock32 -p kernelbase -p gdi32 -p authz -p wintrust -p webservices -p dhcpcsvc -p dbghelp -p msvcrt -p ucrtbase -p crypt32 -p ncrypt -p msi -p msxml6 -p combase -p appxdeploymentclient -p shfolder -p dwmapi -p cfgmgr32 -p dwrite -p imm32 -p shcore -p wtsapi32 -p msctf -p xmllite -p uxtheme -p comdlg32 -p oleacc -p uiautomationcore -p mpr -p winspool -p msimg32 -p richedit -p riched20 -p msftedit -p clusapi -p resutils -p security -p normaliz -p wldp -p rstrtmgr -p wofutil -p sppc -p schannel_tls -p schannel -p schannel_test -p wow64 -p user32 -p gdiplus -p windowscodecs -p d2d1 -p windows_ui -p d3dcompiler_47 -- -D warnings
          cargo clippy --release --target x86_64-pc-windows-msvc -p ntrt -p hello -p abi_test -p crash -p vm_test -p wait_test -p object_test -p thread_test -p kuser_test -p section_test -p file_test -p image_test -p dir_test -p peb_test -p startup_test -p exception_test -p guard_test -p import_test -p args_test -p fpu_test -p sysinfo_test -p threadinfo_test -p filemap_test -p cow_test -p async_test -p apc_test -p ioapc_test -p sync_test -p symlink_test -p iocp_test -p context_test -p timer_test -p clock_test -p handover_test -p handover_k32_test -p handover_net_test -p udp_test -p sshfwd_test -p loader_test -p smp_test -p smpsched_test -p smpmem_test -p smpcow_test -p ledger_test -p bench -p kernel32_test -p missing_import_test -p unimplemented_test -p rpcrt4_test -p rpc_test -p netapi32_test -p pdh_test -p setupapi_test -p clusapi_test -p sspi_test -p dpapi_test -p cert_test -p tds_test -p kernel32_sys_test -p kernel32_thread_test -p kernel32_misc_test -p prng_test -p replay_test -p kernel32_env_test -p kernel32_file_test -p pipe_test -p quota_test -p pagefile_test -p lock_test -p seh_test -p kernel32_sync_test -p kernel32_py_test -p kernel32_locale_test -p disk_test -p rtl_test -p gui_test -p persist_test -p volume_test -p kernel32_system_test -p kernel32_clr_test -p com_test -p bcrypt_test -p console_test -p advapi32_test -p token_test -p security_test -p access_test -p logon_test -p system_test -p lsa_test -p restricted_test -p cmd -p cmd_test -p profile_test -p registry_test -p regnotify_test -p actctx_test -p keyed_event_test -p iphlpapi_test -p afd_poll_test -p dirchange_test -p win32_misc_test -p kernel32_pool_test -p tls_test -p manifest_test -p gala -p gala_cli_test -p start_menu_test -p linux_menu_test -p writeback_test -p taskmgr -p taskmgr_test -p pk_install_test -p galapkg -p smpsem_test -p xstate_test -p vmcycle_test -p xmodify_test -p statedump_test -p snapshot_test -p hotswap_test -p conpty_test -p session_test -p presenter_test -p winsta_test -p clipboard_test -p straddle_test -p smprace_test -p browser_api_test -p dwrite_test -p clockcal_test -p safepoint_test -p shootdown_test -p schannel_tls -p schannel -p schannel_test -p ucrt_test -p office_api_test -p office_k32_test -p msi_test -p webservices_test -p rstrtmgr_test -p wofutil_test -p sppc_test -p sip_test -p actionid_test -p hardlink_test -p threadpool_test -p imagetrim_test -p wintrust_test -p cab_probe -p setupcab_test -p combase_test -p svc_test -p svcrun_test -p msxml_test -p knownfolder_test -p winhttp_cb_test -p runas_test -p gdiplus_test -p windowscodecs_test -p d2d1_test -p uisettings_test -p tray_test -p consolerun -p reparse_test -p wsl -p wsl_test -p explorer -p explorer_test -- -D warnings
          cargo clippy --release --target i686-pc-windows-msvc -p ntrt -p wow64_test -p wow64_thread_test -p testntdll -p testdll32 -p wow64_import_test -p wow64_hotswap_test -p hotswap_dll32 -p wow64_seh_test -p wow64_fs_test -p wow64_k32_test -p kernel32 -p kernelbase -p msvcrt -p ucrtbase -p wow64_ucrt_test -p wow64_office_api_test -p wow64_office_k32_test -p wow64_cert_test -p wow64_msi_test -p wow64_webservices_test -p wow64_rstrtmgr_test -p wow64_hardlink_test -p wow64_threadpool_test -p rstrtmgr -p wow64_wintrust_test -p wow64_setupcab_test -p wow64_combase_test -p wow64_svc_test -p wow64_svcrun_test -p wow64_msxml_test -p wow64_knownfolder_test -p wow64_winhttp_cb_test -p wow64_runas_test -p advapi32 -p bcryptprimitives -p wow64_adv_test -p wow64_regnotify_test -p wow64_actctx_test -p user32 -p gdi32 -p gala_heap -p comctl32 -p oleaut32 -p ole32 -p shell32 -p shlwapi -p version -p mpr -p comdlg32 -p uxtheme -p imm32 -p dwmapi -p msimg32 -p msctf -p winspool -p wtsapi32 -p winhttp -p ws2_32 -p secur32 -p shfolder -p bcrypt -p crypt32 -p ncrypt -p msi -p webservices -p wintrust -p setupapi -p msxml6 -p combase -p appxdeploymentclient -p normaliz -p powrprof -p wldp -p schannel_tls -p schannel -p urlmon -p wininet -p iphlpapi -p wow64_schannel_test -p gdiplus -p windows_ui -p wow64_gdiplus_test -p wow64_uisettings_test -p wow64_tray_test -- -D warnings
      # The checked-in binaries are bytes, so a mismatch here is a question
      # about which toolchain made them (user/lx/build.sh): the versions and
      # each compiler's default -march are printed before the build (an
      # amd64v3 toolchain defaults to x86-64-v3 and gives other bytes), and
      # what this runner built is kept.
      - name: Linux test programs (user/lx) against real Linux; binaries match their sources
        id: lx
        run: |
          gcc --version | head -1
          ld --version | head -1
          musl-gcc --version | head -1
          dpkg-query -W gcc gcc-15 cpp-15-x86-64-linux-gnu libgcc-15-dev binutils libc6-dev musl-tools musl-dev
          gcc -Q --help=target | grep -E '^\s+-m(arch|tune)=' | head -2
          musl-gcc -Q --help=target | grep -E '^\s+-m(arch|tune)=' | head -2
          # -march= alone does not cover musl-dev, whose static libc is
          # compiled for x86-64-v3 whatever musl-gcc defaults to, so say what
          # the code itself is (user/lx/build.sh checks its own output for the
          # same reason).
          if gcc -dM -E - </dev/null | grep -qE '__AVX2__|__AVX__'; then
            echo "::error::gcc is the amd64v3 build (it defines __AVX2__): user/lx/bin cannot be rebuilt with it"
            exit 1
          fi
          vex=$(objdump -d /usr/lib/x86_64-linux-musl/libc.a | grep -cE '[[:space:]](vmov|vpxor|vpunpck|vzero)' || true)
          echo "musl's static libc has $vex VEX-encoded instructions (the plain amd64 build has none)"
          test "$vex" = 0 || { echo "::error::musl-dev is the amd64v3 build; user/lx/bin cannot be rebuilt with it"; exit 1; }
          cargo xtask lx-expect && git diff --exit-code user/lx
      - name: The binaries this runner built (when their bytes differ)
        if: failure() && steps.lx.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lx-bin-built-on-the-runner
          path: user/lx/bin
      - name: Unit tests, gala-um and replay (the boots run in the boot jobs)
        run: cargo xtask test --no-boot
      - name: Checked-in test binaries match their sources
        run: cargo xtask export-tests && git diff --exit-code user/bin

  # The Linux roots' Ubuntu packages, fetched once for all boot shards
  # (`cargo xtask fetch-debs`) and kept in one cache they restore: six
  # shards fetching the same packages from Ubuntu's archive had their
  # connections reset (WORKFLOW "CI build caches"). The newest cache is
  # restored first, so only packages new to the pins are downloaded.
  debs:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache the Linux roots' packages
        uses: actions/cache@v4
        with:
          path: target/prebuilt/debs
          key: gala-debs-${{ hashFiles('xtask/src/main.rs') }}
          restore-keys: gala-debs-
      - name: Fetch what the pins name and the cache lacks
        # Through the mirror the runner's own apt uses: archive.ubuntu.com
        # resets or hangs the runners' connections (xtask ubuntu_mirror).
        env:
          XTASK_UBUNTU_MIRROR: http://azure.archive.ubuntu.com/ubuntu
        run: cargo xtask fetch-debs

  # Every boot scenario, dealt out over parallel runners (xtask's
  # XTASK_SHARD=i/n deals the planned VMs round-robin; a batch stays whole).
  # Each shard builds what it boots and fetches the prebuilt programs; the
  # Linux roots' packages come from the `debs` job's cache.
  boot:
    needs: [changes, debs]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: boot (${{ matrix.shard }}/6)
    env:
      # No incremental data: smaller build caches, and a cached build is
      # reused crate by crate anyway.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the runner's Android, .NET and GHC toolchains; gala needs none)
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      # The build (WORKFLOW "CI build caches"): main's newest, without
      # incremental data; sources dated for cargo by restore-mtimes.sh.
      - name: Restore the build cache (main's newest)
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/x86_64-unknown-none
            target/aarch64-unknown-none-softfloat
            target/x86_64-pc-windows-msvc
            target/aarch64-pc-windows-msvc
            target/i686-pc-windows-msvc
            target/next
            target/debug/deps
            target/debug/build
            target/debug/.fingerprint
            target/cache-stamp
          key: gala-target-boot-${{ github.sha }}
          restore-keys: gala-target-boot-
      - name: Date the sources for cargo (those changed since the cache's commit dated now)
        run: .github/restore-mtimes.sh target/cache-stamp
      - name: Let QEMU use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install QEMU's build dependencies, OVMF, xorriso, gdb
        # gdb, and Yama letting it attach: a QEMU whose monitor stops
        # answering gets its threads' stacks in the failed log
        # (OBSERVABILITY "State dump"); the boot scenarios are where it does.
        run: |
          sudo sysctl -w kernel.yama.ptrace_scope=0
          sudo apt-get update && sudo apt-get install -y gdb ovmf xorriso msitools 7zip unzip openssh-client postgresql-client musl-tools shared-mime-info libglib2.0-bin libglib2.0-dev libpixman-1-dev libslirp-dev flex bison ninja-build python3-venv libfdt-dev zlib1g-dev
      - name: Cache the pinned QEMU
        uses: actions/cache@v4
        with:
          path: ~/.cache/gala-qemu
          key: gala-qemu-11.1.3-x86_64-aarch64-ubuntu-26.04
      - name: Build the pinned QEMU
        run: cargo xtask qemu
      - name: Install Go (for user/go_hello; pinned in xtask GO_TOOLCHAIN)
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache: false
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # The pinned downloads (PREBUILT, the Linux roots' packages), kept
      # between runs: each is checked against its pinned checksum at each
      # use (an unpacked tree carries a marker naming it), so an older cache
      # is safe and only what is missing is fetched; a release host's
      # outage (a 504 from GitHub's release downloads) then fails only the
      # runs that need a new download. Saved even when a boot fails: what
      # was fetched is kept, so a download is made once and not on every
      # run until a whole shard passes.
      - name: Restore the pinned prebuilt programs
        id: prebuilt
        uses: actions/cache/restore@v4
        with:
          path: |
            target/prebuilt
            !target/prebuilt/chromium-syms
            !target/prebuilt/debs
          key: gala-prebuilt-${{ matrix.shard }}-${{ hashFiles('xtask/src/main.rs') }}
          restore-keys: gala-prebuilt-${{ matrix.shard }}-
      - name: Restore the Linux roots' packages (the debs job's)
        uses: actions/cache/restore@v4
        with:
          path: target/prebuilt/debs
          key: gala-debs-${{ hashFiles('xtask/src/main.rs') }}
          fail-on-cache-miss: true
      - name: Boot scenarios, shard ${{ matrix.shard }} of 6
        env:
          XTASK_SHARD: ${{ matrix.shard }}/6
          XTASK_UBUNTU_MIRROR: http://azure.archive.ubuntu.com/ubuntu
        run: cargo xtask boot-test
      - name: Save the pinned prebuilt programs (also when a boot failed)
        if: ${{ !cancelled() && steps.prebuilt.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            target/prebuilt
            !target/prebuilt/chromium-syms
            !target/prebuilt/debs
          key: gala-prebuilt-${{ matrix.shard }}-${{ hashFiles('xtask/src/main.rs') }}
      # Saved from main's pushes only (pull requests read it), by one shard
      # (all six build the same).
      - name: Save the build cache (main, shard 1)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.shard == 1 }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/x86_64-unknown-none
            target/aarch64-unknown-none-softfloat
            target/x86_64-pc-windows-msvc
            target/aarch64-pc-windows-msvc
            target/i686-pc-windows-msvc
            target/next
            target/debug/deps
            target/debug/build
            target/debug/.fingerprint
            target/cache-stamp
          key: gala-target-boot-${{ github.sha }}
      - name: Keep the failed boots' logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-boots-${{ matrix.shard }}
          path: target/failed/
          if-no-files-found: ignore

  # The same test programs (the checked-in user/bin) on real Windows: Windows
  # Server 2025 is build 26100, the pinned build. The report has the schema
  # of `cargo xtask report`, so `cargo xtask compare` reads it.
  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the machine as the sweep expects (docs/windows-triage-brief.md)
        shell: pwsh
        run: |
          # Defender quarantines some of the programs (bench.exe, the tcc.exe
          # the scripts build) as false positives.
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:TEMP
          # The second account the logon and profile tests log on as.
          net user galatest Gala-Test-1 /add
          [Environment]::OSVersion.Version
      - name: Run every test program (user/bin/run-all.ps1)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/windows | Out-Null
          powershell -ExecutionPolicy Bypass -File user\bin\run-all.ps1 -Out target\windows\windows.json
      - name: Fault signatures of crashed programs
        if: always()
        shell: pwsh
        # Each program the report shows ending with an exception status is
        # run again under user/windows/fault.py (a debugger: the runner's
        # SEM_NOGPFAULTERRORBOX keeps Windows Error Reporting from recording
        # it): exception code, module+offset, address and the first-chance
        # exceptions before it (#27).
        run: |
          if (Test-Path target/windows/windows.json) {
            python user/windows/fault.py --report target/windows/windows.json user/bin | Tee-Object -FilePath target/windows/faults.md
            Get-Content target/windows/faults.md >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Summary
        if: always()
        shell: pwsh
        # With user/windows/ci-passing.txt the job fails when a program listed
        # there does not pass on Windows (a test's expectation went wrong).
        run: |
          $baseline = @()
          if (Test-Path user/windows/ci-passing.txt) { $baseline = '--baseline', 'user/windows/ci-passing.txt' }
          python user/windows/ci_summary.py target/windows/windows.json @baseline >> $env:GITHUB_STEP_SUMMARY
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-report
          path: target/windows/

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, OVMF, xorriso
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf xorriso
      - name: Install Go (for user/go_hello; pinned in xtask GO_TOOLCHAIN)
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache: false
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: |
          cargo clippy -p kernel --target x86_64-unknown-none -- -D warnings
          cargo clippy -p kernel --lib --tests -- -D warnings
          cargo clippy -p xtask -- -D warnings
          cargo clippy -p kernel --lib --features hosted -- -D warnings
          cargo clippy -p um -- -D warnings
          cargo build --release --target x86_64-pc-windows-msvc -p testdll -p testdll2 -p testntdll -p kernel32 -p bcryptprimitives
          cargo clippy --release --target x86_64-pc-windows-msvc -p testdll -p testdll2 -p testntdll -p kernel32 -p bcryptprimitives -p comctl32 -p powrprof -p shell32 -p version -p psapi -p ole32 -p oleaut32 -p bcrypt -p tlsdll -p iphlpapi -p secur32 -p winhttp -- -D warnings
          cargo clippy --release --target x86_64-pc-windows-msvc -p ntrt -p hello -p abi_test -p crash -p vm_test -p wait_test -p object_test -p thread_test -p kuser_test -p section_test -p file_test -p image_test -p dir_test -p peb_test -p startup_test -p exception_test -p guard_test -p import_test -p args_test -p fpu_test -p sysinfo_test -p threadinfo_test -p filemap_test -p cow_test -p async_test -p apc_test -p ioapc_test -p sync_test -p symlink_test -p iocp_test -p context_test -p timer_test -p loader_test -p smp_test -p smpsched_test -p smpmem_test -p ledger_test -p bench -p kernel32_test -p missing_import_test -p kernel32_sys_test -p kernel32_thread_test -p kernel32_misc_test -p prng_test -p kernel32_env_test -p kernel32_file_test -p pipe_test -p lock_test -p seh_test -p kernel32_sync_test -p kernel32_locale_test -p kernel32_system_test -p kernel32_clr_test -p com_test -p bcrypt_test -p console_test -p advapi32_test -p registry_test -p keyed_event_test -p iphlpapi_test -p afd_poll_test -p win32_misc_test -p kernel32_pool_test -p tls_test -p manifest_test -- -D warnings
      - name: Unit tests, gala-um and the QEMU boot tests
        run: cargo xtask test
      - name: Checked-in test binaries match their sources
        run: cargo xtask export-tests && git diff --exit-code user/bin

[alias]
xtask = "run --quiet --package xtask --"

[target.x86_64-unknown-none]
# Link at a fixed higher-half address (see kernel/linker.ld) instead of PIE.
# Frame pointers make panic backtraces possible (arch::backtrace).
rustflags = ["-C", "relocation-model=static", "-C", "force-frame-pointers=yes"]

[target.x86_64-pc-windows-msvc]
# Freestanding test programs: link with LLVM's lld-link, no CRT or libraries.
linker = "rust-lld"
rustflags = [
    "-C", "linker-flavor=lld-link",
    "-C", "link-arg=/ENTRY:mainCRTStartup",
    "-C", "link-arg=/SUBSYSTEM:CONSOLE",
    "-C", "link-arg=/NODEFAULTLIB",
    # Reproducible output (no timestamps), so checked-in binaries can be verified.
    "-C", "link-arg=/Brepro",
    # No PDB: its contents are not deterministic and would change the image.
    "-C", "debuginfo=0",
    "-C", "link-arg=/DEBUG:NONE",
]

[target.i686-pc-windows-msvc]
# 32-bit (x86) test programs, run through WOW64 (ARCHITECTURE "Plan:
# WOW64"): linked as the x64 ones are; no SafeSEH tables (nothing here
# raises SEH exceptions through the image's handlers yet).
linker = "rust-lld"
rustflags = [
    "-C", "linker-flavor=lld-link",
    "-C", "link-arg=/ENTRY:mainCRTStartup",
    "-C", "link-arg=/SUBSYSTEM:CONSOLE",
    "-C", "link-arg=/NODEFAULTLIB",
    "-C", "link-arg=/SAFESEH:NO",
    "-C", "link-arg=/Brepro",
    "-C", "debuginfo=0",
    "-C", "link-arg=/DEBUG:NONE",
]

[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# R8: signs the test images' manifests (xtask/src/trust.rs); the kernel
# verifies with the same crate.
ed25519-compact = { version = "=2.6.0", default-features = false }
fontdue = { version = "0.9.5", default-features = false, features = ["hashbrown"] }
resvg = { version = "0.49.0", default-features = false }
